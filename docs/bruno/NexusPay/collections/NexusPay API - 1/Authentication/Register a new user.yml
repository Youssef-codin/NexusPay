info:
  name: Register a new user
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "john@gmail.com",
        "password": "password",
        "full_name": "John Doe"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: User successfully registered
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "john.doe@example.com",
            "password": "SecurePassword123!",
            "full_name": "John Doe"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "john.doe@example.com",
            "full_name": "John Doe",
            "jwt_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
            "refresh_token": "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
          }
  - name: 400 Response
    description: Bad request - invalid input
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "john.doe@example.com",
            "password": "SecurePassword123!",
            "full_name": "John Doe"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Invalid input",
            "message": "Email is required and must be valid",
            "status_code": 400
          }
  - name: 409 Response
    description: Conflict - user already exists
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "john.doe@example.com",
            "password": "SecurePassword123!",
            "full_name": "John Doe"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "User already exists",
            "message": "A user with this email already exists",
            "status_code": 409
          }
  - name: example
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "newuser@example.com",
            "password": "SecurePassword123!",
            "full_name": "New User"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: vary
          value: Origin
        - name: x-ratelimit-limit
          value: "15"
        - name: x-ratelimit-remaining
          value: "13"
        - name: x-ratelimit-reset
          value: "1778113020"
        - name: date
          value: Thu, 07 May 2026 00:16:50 GMT
        - name: content-length
          value: "280"
      body:
        type: json
        data: |-
          {
            "email": "newuser@example.com",
            "full_name": "New User",
            "jwt_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgxMTM5MTAsImlhdCI6MTc3ODExMzAxMCwic3ViIjoiNzYzNzQ2ZjgtY2EyOC00OWE2LTkyZjUtMjhlN2YwOWVhMTFjIn0.hF2HnlJMflAosc4TN9lOwMvXyYZW0maM52mX_lqwj6c",
            "refresh_token": "79bbfb367e6bdb646cbd63a4d67058ac4de02ad35612c54bdc56144c97e8f167"
          }
