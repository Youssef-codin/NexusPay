info:
  name: Refresh access token
  type: http
  seq: 3
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Token refreshed successfully. A rotated refresh token is set as a new HTTP-only cookie.
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      headers:
        - name: Cookie
          value: refresh_token=dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Set-Cookie
          value: refresh_token=<new_token>; Path=/; HttpOnly; SameSite=Lax
      body:
        type: json
        data: |-
          {
            "jwt_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          }
  - name: 401 Response (missing cookie)
    description: Unauthorized - refresh token cookie is missing
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "missing refresh token",
            "status_code": 401
          }
  - name: 401 Response (expired token)
    description: Unauthorized - refresh token has expired
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      headers:
        - name: Cookie
          value: refresh_token=expired_token_value
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Token expired",
            "status_code": 401
          }
  - name: 404 Response (invalid token)
    description: Not found - refresh token does not match any user
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      headers:
        - name: Cookie
          value: refresh_token=invalid_token_value
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "User not found",
            "status_code": 404
          }
