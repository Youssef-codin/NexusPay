info:
  name: Get wallet
  type: http
  seq: 1
  tags:
    - Wallet

http:
  method: GET
  url: "{{baseUrl}}/wallet/"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "user_id": "123e4567-e89b-12d3-a456-426614174000"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Wallet retrieved successfully
    request:
      url: "{{baseUrl}}/wallet/"
      method: GET
      body:
        type: json
        data: |-
          {
            "user_id": "123e4567-e89b-12d3-a456-426614174000"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "123e4567-e89b-12d3-a456-426614174001",
            "user_id": "123e4567-e89b-12d3-a456-426614174000",
            "balance": 100000,
            "created_at": "2024-01-15T10:30:00Z"
          }
  - name: 400 Response
    description: Bad request - missing or invalid user_id
    request:
      url: "{{baseUrl}}/wallet/"
      method: GET
      body:
        type: json
        data: |-
          {}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "bad request",
            "message": "Bad Request",
            "status_code": 400
          }
  - name: 401 Response
    description: Unauthorized - missing or invalid token
    request:
      url: "{{baseUrl}}/wallet/"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Unauthorized",
            "status_code": 401
          }
  - name: 404 Response
    description: Wallet not found for this user
    request:
      url: "{{baseUrl}}/wallet/"
      method: GET
      body:
        type: json
        data: |-
          {
            "user_id": "123e4567-e89b-12d3-a456-426614174000"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "not found",
            "message": "Wallet for this user was not found",
            "status_code": 404
          }
