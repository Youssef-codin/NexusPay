info:
  name: Get payments
  type: http
  seq: 3
  tags:
    - Wallet

http:
  method: GET
  url: "{{baseUrl}}/wallet/payments"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Payment history retrieved successfully
    request:
      url: "{{baseUrl}}/wallet/payments"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "123e4567-e89b-12d3-a456-426614174001",
              "amount": 5000,
              "type": "credit",
              "direction": "incoming",
              "status": "completed",
              "description": "Wallet top-up via Stripe",
              "created_at": "2024-01-15T10:30:00Z"
            }
          ]
  - name: 401 Response
    description: Unauthorized - missing or invalid token
    request:
      url: "{{baseUrl}}/wallet/payments"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Missing or invalid authorization token",
            "status_code": 401
          }
  - name: 404 Response
    description: Wallet not found for authenticated user
    request:
      url: "{{baseUrl}}/wallet/payments"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "not found",
            "message": "Wallet for this user was not found",
            "status_code": 404
          }
