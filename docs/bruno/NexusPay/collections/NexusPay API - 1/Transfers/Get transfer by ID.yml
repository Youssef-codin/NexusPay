info:
  name: Get transfer by ID
  type: http
  seq: 3
  tags:
    - Transfers

http:
  method: GET
  url: "{{baseUrl}}/transfers/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Transfer retrieved successfully
    request:
      url: "{{baseUrl}}/transfers/:id"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
{
            "transfer": {
              "id": "123e4567-e89b-12d3-a456-426614174001",
              "from_wallet_id": "123e4567-e89b-12d3-a456-426614174000",
              "to_wallet_id": "123e4567-e89b-12d3-a456-426614174002",
              "to_user": {
                "id": "123e4567-e89b-12d3-a456-426614174003",
                "full_name": "John Doe"
              },
              "amount_in_piastres": 5000,
              "direction": "credit",
              "status": "completed",
              "note": "Dinner split",
              "created_at": "2024-01-15T10:30:00Z"
            }
          }
  - name: 400 Response
    description: Bad request - invalid UUID
    request:
      url: "{{baseUrl}}/transfers/:id"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Bad request",
            "message": "invalid id",
            "status_code": 400
          }
  - name: 403 Response
    description: Forbidden - transfer belongs to another user
    request:
      url: "{{baseUrl}}/transfers/:id"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Forbidden",
            "message": "Transfer belongs to another user",
            "status_code": 403
          }
  - name: 404 Response
    description: Not found - transfer not found
    request:
      url: "{{baseUrl}}/transfers/:id"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transfer was not found",
            "message": "Transfer was not found",
            "status_code": 404
          }
  - name: 401 Response
    description: Unauthorized - missing or invalid token
    request:
      url: "{{baseUrl}}/transfers/:id"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "unauthorized",
            "message": "Missing or invalid authorization token",
            "status_code": 401
          }
  - name: example
    request:
      url: "{{baseUrl}}/transfers/123e4567-e89b-12d3-a456-426614174001"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: vary
          value: Origin
        - name: x-ratelimit-limit
          value: "15"
        - name: x-ratelimit-remaining
          value: "13"
        - name: x-ratelimit-reset
          value: "1778113020"
        - name: date
          value: Thu, 07 May 2026 00:16:50 GMT
        - name: content-length
          value: "280"
      body:
        type: json
        data: |-
          {
            "transfer": {
              "id": "123e4567-e89b-12d3-a456-426614174001",
              "from_wallet_id": "023e4567-e89b-12d3-a456-426614174000",
              "to_wallet_id": "223e4567-e89b-12d3-a456-426614174002",
              "to_user": {
                "id": "323e4567-e89b-12d3-a456-426614174003",
                "full_name": "John Doe"
              },
              "amount_in_piastres": 5000,
              "direction": "credit",
              "status": "completed",
              "note": "Dinner split",
              "created_at": "2024-01-15T10:30:00Z"
            }
          }
