info:
  name: Cancel scheduled transaction
  type: http
  seq: 4
  tags:
    - Transactions

http:
  method: DELETE
  url: "{{baseUrl}}/transactions/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

docs: |-
  Deletes the row while it is still 'scheduled'. This races the scheduler
  correctly: the delete blocks on the scheduler's row lock and then affects zero
  rows, so whichever lands first wins and the money can never move twice.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Cancelled successfully
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cancelled_id": "123e4567-e89b-12d3-a456-426614174001"
          }
  - name: 409 Response
    description: The scheduler already executed it
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: DELETE
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transaction is no longer scheduled"
          }
  - name: 403 Response
    description: Belongs to another user
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transaction belongs to another user"
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transaction was not found"
          }
