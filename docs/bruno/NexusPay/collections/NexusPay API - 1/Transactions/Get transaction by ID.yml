info:
  name: Get transaction by ID
  type: http
  seq: 3
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/transactions/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Transaction retrieved
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "transaction": {
              "id": "123e4567-e89b-12d3-a456-426614174001",
              "sender": { "id": "123e4567-e89b-12d3-a456-426614174000", "full_name": "John Doe" },
              "receiver": { "id": "123e4567-e89b-12d3-a456-426614174002", "full_name": "Jane Roe" },
              "amount_in_piastres": 5000,
              "direction": "debit",
              "status": "completed",
              "created_at": "2024-01-15T10:30:00Z"
            }
          }
  - name: 403 Response
    description: Belongs to another user
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transaction belongs to another user"
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/transactions/:id"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Transaction was not found"
          }
