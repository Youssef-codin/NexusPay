info:
  name: Get transfers
  type: http
  seq: 2
  tags:
    - Transfers

http:
  method: GET
  url: "{{baseUrl}}/transfers/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Transfers retrieved successfully
    request:
      url: "{{baseUrl}}/transfers/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "transfers": [
              {
