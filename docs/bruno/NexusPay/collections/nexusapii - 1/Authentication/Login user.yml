    description: Login successful
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "youssef@gmail.com",
            "password": "passwrd"
          }
    response:
      status: 200
      statusText: OK
