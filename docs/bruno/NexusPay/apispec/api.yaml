openapi: 3.0.0
info:
  title: api
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: Login user
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_authentication_login_user_yml
      description: ''
      tags:
        - Authentication
      responses:
        '200':
          description: OK. Refresh token is set as an HTTP-only cookie.
          headers:
            Set-Cookie:
              description: >-
                refresh_token=<token>; Path=/; HttpOnly; SameSite=Lax.
                Expires after 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  full_name:
                    type: string
                  jwt_token:
                    type: string
              examples:
                200_Response:
                  value:
                    email: john.doe@example.com
                    full_name: John Doe
                    jwt_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  summary: 200 Response
                  description: Login successful
                example:
                  value:
                    email: youssef@gmail.com
                    full_name: Youssef Hany
                    jwt_token: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgxMTM5MTAsImlhdCI6MTc3ODExMzAxMCwic3ViIjoiNzYzNzQ2ZjgtY2EyOC00OWE2LTkyZjUtMjhlN2YwOWVhMTFjIn0.hF2HnlJMflAosc4TN9lOwMvXyYZW0maM52mX_lqwj6c
                  summary: example
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: invalid credentials
                message: The provided credentials are incorrect
                status_code: 401
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: user not found
                message: No user found with this email
                status_code: 404
      requestBody:
        $ref: '#/components/requestBodies/login_user'
  /users/logout:
    post:
      summary: Logout user
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_authentication_logout_user_yml
      description: ''
      tags:
        - Authentication
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: unauthorized
                message: Missing or invalid authorization token
                status_code: 401
      security:
        - logout_user: []
  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_authentication_refresh_access_token_yml
      description: ''
      tags:
        - Authentication
      responses:
        '200':
          description: OK. Rotated refresh token is set as a new HTTP-only cookie.
          headers:
            Set-Cookie:
              description: >-
                refresh_token=<new_token>; Path=/; HttpOnly; SameSite=Lax.
                Expires after 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt_token:
                    type: string
              examples:
                200_Response:
                  value:
                    jwt_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  summary: 200 Response
                  description: Token refreshed successfully
                example:
                  value:
                    jwt_token: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgxMTM5MTAsImlhdCI6MTc3ODExMzAxMCwic3ViIjoiNzYzNzQ2ZjgtY2EyOC00OWE2LTkyZjUtMjhlN2YwOWVhMTFjIn0.hF2HnlJMflAosc4TN9lOwMvXyYZW0maM52mX_lqwj6c
                  summary: example
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: User not found
                message: Invalid or expired refresh token
                status_code: 404
  /auth/register:
    post:
      summary: Register a new user
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_authentication_register_a_new_user_yml
      description: ''
      tags:
        - Authentication
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  full_name:
                    type: string
                  jwt_token:
                    type: string
                  refresh_token:
                    type: string
              examples:
                201_Response:
                  value:
                    email: john.doe@example.com
                    full_name: John Doe
                    jwt_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
                  summary: 201 Response
                  description: User successfully registered
                example:
                  value:
                    email: newuser@example.com
                    full_name: New User
                    jwt_token: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgxMTM5MTAsImlhdCI6MTc3ODExMzAxMCwic3ViIjoiNzYzNzQ2ZjgtY2EyOC00OWE2LTkyZjUtMjhlN2YwOWVhMTFjIn0.hF2HnlJMflAosc4TN9lOwMvXyYZW0maM52mX_lqwj6c
                    refresh_token: >-
                      79bbfb367e6bdb646cbd63a4d67058ac4de02ad35612c54bdc56144c97e8f167
                  summary: example
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: Invalid input
                message: Email is required and must be valid
                status_code: 400
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: User already exists
                message: A user with this email already exists
                status_code: 409
      requestBody:
        $ref: '#/components/requestBodies/register_a_new_user'
      servers:
        - url: http://localhost:3000
  /users/test:
    get:
      summary: Test authentication
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_authentication_test_authentication_yml
      description: ''
      tags:
        - Authentication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  exp:
                    type: integer
                  iat:
                    type: integer
              examples:
                200_Response:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    exp: 1705317600
                    iat: 1704712800
                  summary: 200 Response
                  description: Authentication successful, returns token claims
                example:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    exp: 1705317600
                    iat: 1704712800
                  summary: example
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: unauthorized
                message: Missing or invalid authorization token
                status_code: 401
      security:
        - test_authentication: []
  /healthx:
    get:
      summary: Health check endpoint
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_health_health_check_endpoint_yml
      description: ''
      tags:
        - Health
      responses:
        '204':
          description: No Content
  /users?name=John:
    get:
      summary: Search users
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_users_search_users_yml
      description: ''
      tags:
        - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        full_name:
                          type: string
              example:
                users:
                  - id: 123e4567-e89b-12d3-a456-426614174001
                    full_name: John Doe
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: unauthorized
                message: Missing or invalid authorization token
                status_code: 401
      parameters:
        - name: name
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: John
      security:
        - search_users: []
  /users/me:
    get:
      summary: Get my profile and balance
      operationId: get_me
      description: Replaces GET /wallet/{userId} — the balance now lives on the user.
      tags:
        - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  full_name:
                    type: string
                  balance:
                    type: integer
                  created_at:
                    type: string
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                email: john@gmail.com
                full_name: John Doe
                balance: 100000
                created_at: '2024-01-15T10:30:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: unauthorized
                status_code: 401
      security:
        - get_me: []
  /transactions:
    get:
      summary: Get my transactions
      operationId: get_transactions
      description: >-
        Every transaction the caller is on either side of, newest first, with the
        counterparty's name and a direction field.
      tags:
        - Transactions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/transaction'
              example:
                transactions:
                  - id: 123e4567-e89b-12d3-a456-426614174001
                    sender:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      full_name: John Doe
                    receiver:
                      id: 123e4567-e89b-12d3-a456-426614174002
                      full_name: Jane Roe
                    amount_in_piastres: 5000
                    direction: debit
                    status: completed
                    note: Dinner split
                    sender_category: food
                    scheduled_at: '2024-01-15T10:30:00Z'
                    created_at: '2024-01-15T10:30:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: unauthorized
                status_code: 401
      security:
        - get_transactions: []
    post:
      summary: Create transaction
      operationId: create_transaction
      description: >-
        Transfers money to another user. With scheduled_at set the row is stored
        as 'scheduled' and the scheduler executes it when it comes due;
        without it the transfer is committed as 'crediting' and completed
        immediately, so a crash mid-flight leaves a row the sweeper can finish.
      tags:
        - Transactions
      requestBody:
        $ref: '#/components/requestBodies/create_transaction'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction'
              examples:
                immediate:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174001
                    sender:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      full_name: John Doe
                    receiver:
                      id: 123e4567-e89b-12d3-a456-426614174002
                      full_name: Jane Roe
                    amount_in_piastres: 5000
                    status: completed
                    note: Dinner split
                    created_at: '2024-01-15T10:30:00Z'
                  summary: Immediate transfer
                scheduled:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174001
                    sender:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      full_name: John Doe
                    receiver:
                      id: 123e4567-e89b-12d3-a456-426614174002
                      full_name: Jane Roe
                    amount_in_piastres: 5000
                    status: scheduled
                    note: Rent
                    scheduled_at: '2024-02-01T09:00:00Z'
                    created_at: '2024-01-15T10:30:00Z'
                  summary: Scheduled transfer
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                too_low:
                  value:
                    error: amount is too low, must be at least 10 EGP (1000 piastres)
                    status_code: 400
                  summary: Amount below the minimum
                self_transfer:
                  value:
                    error: Can not transfer to self
                    status_code: 400
                  summary: Sender equals receiver
                insufficient:
                  value:
                    error: Insufficient funds
                    status_code: 400
                  summary: Insufficient funds
                not_future:
                  value:
                    error: Scheduled time must be in the future
                    status_code: 400
                  summary: scheduled_at in the past
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: unauthorized
                status_code: 401
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: User was not found
                status_code: 404
      security:
        - create_transaction: []
  /transactions/topup:
    post:
      summary: Top up
      operationId: top_up
      description: >-
        Creates a Stripe PaymentIntent and an 'awaiting_payment' transaction sent
        by the Stripe system user. No balance changes here — the credit only
        happens when the payment_intent.succeeded webhook lands.
      tags:
        - Transactions
      requestBody:
        $ref: '#/components/requestBodies/top_up'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: string
                  amount_in_piastres:
                    type: integer
                  status:
                    type: string
                  provider_payment_id:
                    type: string
                  client_secret:
                    type: string
              example:
                transaction_id: 123e4567-e89b-12d3-a456-426614174001
                amount_in_piastres: 5000
                status: awaiting_payment
                provider_payment_id: pi_test123
                client_secret: pi_test123_secret_abc
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: amount is too low, must be at least 10 EGP (1000 piastres)
                status_code: 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: unauthorized
                status_code: 401
      security:
        - top_up: []
  /transactions/{id}:
    get:
      summary: Get transaction by ID
      operationId: get_transaction_by_id
      description: ''
      tags:
        - Transactions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/transaction'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction belongs to another user
                status_code: 403
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction was not found
                status_code: 404
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
      security:
        - get_transaction_by_id: []
    delete:
      summary: Cancel scheduled transaction
      operationId: cancel_transaction
      description: >-
        Deletes the row while it is still 'scheduled'. This races the scheduler
        correctly: the delete blocks on the scheduler's row lock and then affects
        zero rows, so whichever lands first wins and the money can never move twice.
      tags:
        - Transactions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled_id:
                    type: string
              example:
                cancelled_id: 123e4567-e89b-12d3-a456-426614174001
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction belongs to another user
                status_code: 403
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction was not found
                status_code: 404
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction is no longer scheduled
                status_code: 409
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
      security:
        - cancel_transaction: []
  /transactions/{id}/category:
    patch:
      summary: Set my expense category
      operationId: set_transaction_category
      description: >-
        Sets sender_category or receiver_category depending on which side of the
        transaction the caller is on.
      tags:
        - Transactions
      requestBody:
        $ref: '#/components/requestBodies/set_transaction_category'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/transaction'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Invalid expense category
                status_code: 400
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction belongs to another user
                status_code: 403
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              example:
                error: Transaction was not found
                status_code: 404
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
      security:
        - set_transaction_category: []
  /webhook/stripe:
    post:
      summary: Stripe webhook
      operationId: >-
        home_joe-arch_projects_go_nexus_docs_bruno_nexuspay_collections_nexusapii_webhooks_stripe_webhook_yml
      description: ''
      tags:
        - Webhooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
              examples:
                200_Response:
                  value:
                    received: true
                  summary: 200 Response
                  description: Webhook handled successfully
                example:
                  value:
                    received: true
                  summary: example
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  status_code:
                    type: integer
              example:
                error: invalid signature
                message: Webhook signature verification failed
                status_code: 400
      parameters:
        - name: Stripe-Signature
          in: header
          description: ''
          required: true
          schema:
            type: string
          example: whsec_test_signature
      requestBody:
        $ref: '#/components/requestBodies/stripe_webhook'
servers:
  - url: http://localhost:3000
    description: Base Server
  - url: http://localhost:3000
    description: Development server
  - url: api.nexuspay.com
    description: Production server
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: string
        status_code:
          type: integer
    user_mini:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
    transaction:
      type: object
      properties:
        id:
          type: string
        sender:
          $ref: '#/components/schemas/user_mini'
        receiver:
          $ref: '#/components/schemas/user_mini'
        amount_in_piastres:
          type: integer
        direction:
          type: string
          enum:
            - debit
            - credit
          description: Which side of the transaction the caller is on.
        status:
          type: string
          enum:
            - awaiting_payment
            - crediting
            - scheduled
            - completed
            - failed
        note:
          type: string
        sender_category:
          $ref: '#/components/schemas/expense_category'
        receiver_category:
          $ref: '#/components/schemas/expense_category'
        scheduled_at:
          type: string
        created_at:
          type: string
    expense_category:
      type: string
      enum:
        - food
        - transport
        - bills
        - shopping
        - income
        - topup
        - other
    login_user:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: youssef@gmail.com
        password: passwrd
    register_a_new_user:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
      example:
        email: john@gmail.com
        password: password
        full_name: John Doe
    create_transaction:
      type: object
      properties:
        receiver_id:
          type: string
        amount_in_piastres:
          type: integer
          minimum: 1000
        note:
          type: string
        category:
          $ref: '#/components/schemas/expense_category'
        scheduled_at:
          type: string
          description: When set, the transaction is stored as 'scheduled' instead of executing now.
      example:
        receiver_id: 123e4567-e89b-12d3-a456-426614174002
        amount_in_piastres: 5000
        note: Dinner split
        category: food
    set_transaction_category:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/expense_category'
      example:
        category: food
    top_up:
      type: object
      properties:
        amount_in_piastres:
          type: integer
          minimum: 1000
      example:
        amount_in_piastres: 5000
    stripe_webhook:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          properties:
            object:
              type: object
              properties:
                id:
                  type: string
                amount:
                  type: integer
                currency:
                  type: string
                status:
                  type: string
